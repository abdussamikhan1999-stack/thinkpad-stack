services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped
    # after first run, edit ./searxng/settings.yml -> server.method: "POST"
    # (default GET logs full plaintext queries in the nginx access log)

  matrix-conduit:
    image: matrixconduit/matrix-conduit:latest
    container_name: conduit
    ports:
      - "6167:6167"
    volumes:
      - ./conduit-data:/var/lib/matrix-conduit
    environment:
      CONDUIT_SERVER_NAME: "localhost"   # change to your real domain or Tailscale MagicDNS name
      CONDUIT_DATABASE_PATH: "/var/lib/matrix-conduit"
      CONDUIT_DATABASE_BACKEND: "rocksdb"
      CONDUIT_PORT: "6167"
      CONDUIT_ALLOW_REGISTRATION: "false"
      CONDUIT_ALLOW_FEDERATION: "false"   # private island; set true to federate
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - ./open-webui-data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
